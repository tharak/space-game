<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=contain">
  <meta name="theme-color" content="#0b0e14">
  <title>Successor Stars — Battle Prototype</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b0e14; color: #d7deef; font-family: system-ui, sans-serif; }
    body { height: 100dvh; }
    #game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #loading, #error { position: fixed; inset: 0; display: grid; place-content: center; padding: 2rem; text-align: center; background: #0b0e14; z-index: 10; }
    #loading h1 { font-weight: 500; letter-spacing: .12em; color: #ffd166; }
    #loading p { color: #8892ab; }
    #error { display: none; color: #ff9a7a; white-space: pre-wrap; }
    #build { position: fixed; bottom: 4px; left: 8px; font-size: 10px; color: #8892ab; pointer-events: none; }
    @media (max-width: 759px) { #build { display: none; } #loading h1 { font-size: clamp(1.2rem, 6vw, 2rem); } }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Successor Stars battle board"></canvas>
  <div id="loading"><h1>SUCCESSOR STARS</h1><p>Plotting fleet positions…</p></div>
  <div id="error" role="alert"></div>
  <span id="build">Build __BUILD_SHA__</span>
  <script type="module">
    const loading = document.querySelector('#loading');
    const showError = (error) => {
      const message = error?.message || String(error);
      // winit uses an exception to yield control to the browser event loop.
      if (message.includes("Using exceptions for control flow")) return;
      loading.style.display = 'none';
      const panel = document.querySelector('#error');
      panel.style.display = 'grid';
      if (panel.hasAttribute("data-panic")) { console.error(panel.getAttribute("data-panic")); return; }
      panel.textContent = `Unable to start Successor Stars.\n${message}\nUse a browser with WebGL2 enabled, then reload.`;
    };
    window.addEventListener('error', (event) => showError(event.error || event.message));
    window.addEventListener('unhandledrejection', (event) => showError(event.reason));
    const canvas = document.querySelector('#game');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    if (!document.createElement('canvas').getContext('webgl2')) {
      showError(new Error('WebGL2 is unavailable.'));
    } else {
      try {
        const { default: init } = await import('./pkg/__BUILD_ID__/space_game.js');
        await init();
      } catch (error) { showError(error); }
    }
  </script>
</body>
</html>
